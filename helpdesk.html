<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="description" content="sample description">
		<meta name="keywords" content="cwa,help,desk,appointment">
		<meta name="author" content="SWH03403">
		<title>CWA Help Desk Appointment</title>
	</head>
	<body>
		<img src="/logo.png" alt="Swinburne Logo">
		<h1>CWA Help Desk Appointment</h1>
		<p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
		<p>Check Blackboard for when CWA tutors will be there.</p>
		<form method="POST">
			<fieldset>
				<legend>Student details</legend>
				<p>
					<label for="student-id">Student ID</label>
					<input type="number" name="student-id" required minlength="7" maxlength="10">
				</p>
				<p>
					<label for="student-first-name">Given Name</label>
					<input
						type="text"
						name="student-first-name"
						required
						pattern="[A-Z][a-z]+"
						maxlength="15">
					<label for="student-last-name">Family Name</label>
					<input
						type="text"
						name="student-last-name"
						required
						pattern="[A-Z][a-z]+"
						maxlength="15">
				</p>
			</fieldset>
			<fieldset>
				<legend>Your unit</legend>
				<input id="unit-cos10011" type="radio" name="unit-name" value="cos10011" required>
				<label for="unit-cos10011">COS110011</label>
				<input id="unit-cos60004" type="radio" name="unit-name" value="cos60004">
				<label for="unit-cos60004">COS60004</label>
				<input id="unit-cos60007" type="radio" name="unit-name" value="cos60007">
				<label for="unit-cos60007">COS60007</label>
				<p>
					<label for="unit-tutor">Your Tutor</label>
					<select name="unit-tutor" required>
						<option value="" selected>Please Select</option>
						<option value="miss-a">Miss A</option>
						<option value="missus-b">Mrs. B</option>
						<option value="mister-c">Mr. C</option>
					</select>
				</p>
			</fieldset>
			<fieldset>
				<legend>Issue</legend>
				<label for="issue-html">HTML</label>
				<input type="checkbox" id="issue-html" name="issue-tags" value="html" checked>
				<label for="issue-css">CSS</label>
				<input type="checkbox" id="issue-css" name="issue-tags" value="css">
				<label for="issue-js">Javascript</label>
				<input type="checkbox" id="issue-js" name="issue-tags" value="js">
				<label for="issue-php">PHP</label>
				<input type="checkbox" id="issue-php" name="issue-tags" value="php">
				<label for="issue-mysql">MySQL</label>
				<input type="checkbox" id="issue-mysql" name="issue-tags" value="mysql">
				<p>
					<label for="issue-description">Description of Issue</label>
					<br>
					<textarea
						rows="5"
						cols="32"
						name="issue-description"
						placeholder="Write description of your problem here..."
					></textarea>
				</p>
			</fieldset>
			<fieldset>
				<legend>Preferred Date / Time</legend>
				<p>
					<label for="preferred-date">Date</label>
					<input
						type="text"
						name="preferred-date"
						placeholder="dd/mm/yyyy"
						pattern="(\d{2}\/){2}\d{4}">
				</p>
				<p>
					<label for="preferred-time">Time</label>
					<input
						type="text"
						name="preferred-time"
						placeholder="hh:mm"
						pattern="\d{2}:\d{2}">
				</p>
			</fieldset>
			<input type="submit" value="Book">
			<input type="reset" value="Reset Form">
		</form>
	</body>
</html>
